<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sistema de Faltas</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body class="pagina-login">

    <main class="login-pagina">

        <div class="area-login">

            <!-- IDENTIDADE DO SISTEMA -->
            <div class="identidade-login">

                <div class="icone-login">
                    ✓
                </div>

                <div>
                    <h1>Sistema de Faltas</h1>
                    <p>Portal Acadêmico</p>
                </div>

            </div>


            <!-- CARD -->
            <section class="login-container">

                <span class="login-tag">
                    ACESSO AO SISTEMA
                </span>

                <h2>Bem-vindo</h2>

                <p class="subtitulo">
                    Entre com seu RA e senha para acessar sua conta.
                </p>


                <form>

                    <div class="campo">

                        <label for="ra">
                            RA
                        </label>

                        <input
                            type="text"
                            id="ra"
                            name="ra"
                            placeholder="Digite seu RA"
                            required
                        >

                    </div>


                    <div class="campo">

                        <label for="senha">
                            Senha
                        </label>

                        <input
                            type="password"
                            id="senha"
                            name="senha"
                            placeholder="Digite sua senha"
                            required
                        >

                    </div>


                    <button
                        class="botao-login"
                        type="submit"
                    >
                        Entrar
                        <span>→</span>
                    </button>

                </form>


                <!-- CADASTRO -->
                <div class="criar-conta">

                    <span>
                        Ainda não possui uma conta?
                    </span>

                    <a href="cadastro.html">
                        Criar conta
                    </a>

                </div>

            </section>


            <!-- RODAPÉ -->
            <div class="login-rodape">

                <span></span>

                Acesso para alunos e professores

            </div>

        </div>

    </main>

</body>

</html>
